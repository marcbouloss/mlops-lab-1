[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "Food-11 image classification with a reproducible DVC pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "dvc-http>=2.32",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "pillow>=10.4",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "mlflow>=2.16",
    "dagshub>=0.3.30",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
